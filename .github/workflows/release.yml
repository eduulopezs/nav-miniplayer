name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Construir y verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # firma de la attestation
      attestations: write   # publica la attestation de procedencia
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que el tag coincide con manifest.json
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::El tag $TAG no coincide con la versión del manifest (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run zip

      - name: Calcular SHA256
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          sha256sum "nav-miniplayer-$VERSION.zip" > "nav-miniplayer-$VERSION.zip.sha256"
          cat "nav-miniplayer-$VERSION.zip.sha256"

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/nav-miniplayer-${{ steps.ver.outputs.version }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/nav-miniplayer-${{ steps.ver.outputs.version }}.zip*
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/nav-miniplayer-$VERSION.zip" \
            "dist/nav-miniplayer-$VERSION.zip.sha256" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
