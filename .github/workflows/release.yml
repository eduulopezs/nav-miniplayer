name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Construir y verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # firma de la attestation
      attestations: write   # publica la attestation de procedencia
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que el tag coincide con manifest.json
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::El tag $TAG no coincide con la versión del manifest (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run zip

      - name: Calcular SHA256
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          sha256sum "nav-miniplayer-$VERSION.zip" > "nav-miniplayer-$VERSION.zip.sha256"
          cat "nav-miniplayer-$VERSION.zip.sha256"

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nav-miniplayer-${{ steps.ver.outputs.version }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/nav-miniplayer-${{ steps.ver.outputs.version }}.zip*
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/nav-miniplayer-$VERSION.zip" \
            "dist/nav-miniplayer-$VERSION.zip.sha256" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
