name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Verificaciones rápidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - name: Empaquetar
        run: npm run zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    name: e2e en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: e2e
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
      - name: Resumen de los tests que fallan (como anotaciones)
        if: failure()
        run: grep -E -A4 '^(not ok|    not ok)|^  error:|^  (\+|-) ' e2e.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Capturas de los diseños
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capturas-disenos
          path: tests/e2e/__shots__/
          if-no-files-found: ignore
