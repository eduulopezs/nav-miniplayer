name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verificaciones rápidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Empaquetar
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    name: e2e en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: e2e
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
      - name: Resumen de los tests que fallan (como anotaciones)
        if: failure()
        run: grep -E -A4 '^(not ok|    not ok)|^  error:|^  (\+|-) ' e2e.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Capturas de los diseños
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-disenos
          path: tests/e2e/__shots__/
          if-no-files-found: ignore
